<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BetCoin | Accediendo...</title>

  <!-- META REDIRECT -->
  <meta http-equiv="refresh" content="2;url=https://TU-LINK-DE-REGISTRO.com"/>

  <!-- 🔥 META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}
    (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', 'TU_PIXEL_ID');
    fbq('track', 'PageView'); // visita a la bridge
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=TU_PIXEL_ID&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #5c178f, #120018);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      max-width: 420px;
      width: 90%;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
    }

    .logo span {
      color: #ffbf00;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 20px;
      background: #ffbf00;
      color: black;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="logo">BET<span>COIN</span></div>

  <h2>Ingresando a la plataforma...</h2>
  <p>Te estamos redirigiendo automáticamente</p>

  <a id="btn" class="btn" href="#">INGRESAR AHORA</a>
</div>

<script>
  const DESTINO = "https://TU-LINK-DE-REGISTRO.com";

  // Mantener UTMs
  const params = window.location.search;
  const finalUrl = params ? DESTINO + params : DESTINO;

  document.getElementById("btn").href = finalUrl;

  // 🔥 Evento clave: gente que REALMENTE va a la plataforma
  function redirect() {
    fbq('trackCustom', 'BridgeRedirect', {
      destino: 'plataforma'
    });

    setTimeout(() => {
      window.location.href = finalUrl;
    }, 150); // le damos tiempo a que dispare el pixel
  }

  // Auto redirect
  setTimeout(redirect, 2000);

  // Click manual
  document.getElementById("btn").addEventListener("click", function(e){
    e.preventDefault();
    redirect();
  });

</script>

</body>
</html>

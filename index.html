<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso VIP</title>
  <meta name="description" content="Acceso VIP por WhatsApp. Atención 24/7." />

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      t=b.createElement(e);t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '857136047183641');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=857136047183641&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    :root{
      --stroke:rgba(255,255,255,.08);
      --text:#EAF0FF;
      --muted:rgba(234,240,255,.65);
      --gold1:#FFDF8A; --gold2:#E7A728; --gold3:#B87410;
      --shadow:0 30px 70px rgba(0,0,0,.55);
      --radius:22px;
      --wa1:#25D366; --wa2:#1FB85A; --wa3:#128C7E;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 900px at 50% -100px, rgba(255,186,64,.18), transparent 55%),
        radial-gradient(900px 700px at 50% 240px, rgba(255,186,64,.10), transparent 60%),
        linear-gradient(180deg, #050814 0%, #050814 30%, #04060E 100%);
      color:var(--text);
    }
    .wrap{max-width:460px;margin:0 auto;padding:26px 18px 30px}
    .brand{display:flex;justify-content:center;margin:10px 0}
    .coin{
      width:150px;height:150px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), transparent 42%),
        radial-gradient(circle at 50% 65%, rgba(255,186,64,.20), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.75));
      border:1px solid rgba(255,186,64,.22);
      box-shadow:0 20px 50px rgba(0,0,0,.55);
      text-align:center;
    }
    .title{
      font-weight:900;letter-spacing:.10em;font-size:22px;
      padding:0 10px; text-align:center;
      background: linear-gradient(180deg, var(--gold1), var(--gold2), var(--gold3));
      -webkit-background-clip:text;background-clip:text;color:transparent;
      line-height:1.15;
    }
    .vip{text-align:center;margin:12px 0 18px}
    .vip span{
      border:1px solid rgba(255,186,64,.28);
      padding:10px 18px;border-radius:999px;
      font-weight:700;font-size:12px;letter-spacing:.12em;
      color:rgba(255,223,138,.95);
    }
    .card{
      background: linear-gradient(180deg, rgba(11,22,48,.92), rgba(8,14,30,.92));
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:18px;
    }
    h1{margin:0 0 8px;font-size:28px;text-transform:uppercase}
    .gold{color:var(--gold2)}
    .sub{margin:0 0 16px;color:var(--muted)}
    .hint{
      margin:0 0 10px;
      font-size:12px;
      color:rgba(234,240,255,.75);
      text-align:center;
      letter-spacing:.04em;
    }

    /* BOTON WHATSAPP LLAMATIVO */
    .waBtn{
      width:100%;
      padding:16px 16px;
      border-radius:18px;
      border:0;
      cursor:pointer;
      color:#05210f;
      font-weight:950;
      letter-spacing:.06em;
      text-transform:uppercase;
      background: linear-gradient(180deg, var(--wa1), var(--wa2));
      box-shadow:
        0 14px 35px rgba(37,211,102,.25),
        0 8px 22px rgba(0,0,0,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      position:relative;
      transform:translateZ(0);
      transition:transform .12s ease, filter .12s ease;
    }
    .waBtn:hover{filter:brightness(1.03)}
    .waBtn:active{transform:scale(.985)}
    .waBtn .label{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
    .waBtn .top{font-size:12px;opacity:.92}
    .waBtn .main{font-size:14px;line-height:1.05}

    /* pulso suave para llamar la atención */
    .waBtn::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:22px;
      border:1px solid rgba(37,211,102,.35);
      box-shadow:0 0 0 0 rgba(37,211,102,.30);
      animation:pulse 1.6s infinite;
      pointer-events:none;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(37,211,102,.28)}
      70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}
      100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}
    }

    .waIcon{
      width:26px;height:26px;flex:0 0 26px;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));
    }

    footer{text-align:center;margin-top:14px;font-size:12px;color:rgba(234,240,255,.55)}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">
      <div class="coin">
        <div class="title">PLATAFORMA VERIFICADA</div>
      </div>
    </div>

    <div class="vip"><span>ACCESO VIP</span></div>

    <div class="card">
      <h1>OBTENÉ UN <span class="gold">100%</span><br>ADICIONAL</h1>
      <p class="sub" style="text-align:center;">Acceso inmediato por WhatsApp.</p>

      <p class="hint">Tocá el botón verde para hablar con un operador.</p>

      <button id="waBtn" class="waBtn" aria-label="Hablar por WhatsApp">
        <!-- Icono WhatsApp (SVG) -->
        <svg class="waIcon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#ffffff" d="M19.11 17.44c-.27-.14-1.58-.78-1.82-.87-.24-.09-.42-.14-.6.14-.18.27-.69.87-.85 1.05-.16.18-.31.2-.58.07-.27-.14-1.14-.42-2.17-1.35-.8-.71-1.34-1.59-1.49-1.86-.16-.27-.02-.42.12-.55.12-.12.27-.31.4-.47.14-.16.18-.27.27-.45.09-.18.04-.34-.02-.47-.07-.14-.6-1.45-.82-1.99-.22-.53-.44-.46-.6-.47h-.51c-.18 0-.47.07-.71.34-.24.27-.94.92-.94 2.25 0 1.33.96 2.61 1.09 2.79.14.18 1.89 2.89 4.58 4.05.64.28 1.14.44 1.53.56.64.2 1.22.17 1.68.1.51-.08 1.58-.64 1.8-1.26.22-.62.22-1.15.16-1.26-.07-.11-.24-.18-.51-.31z"/>
          <path fill="#ffffff" d="M16.02 5.33c-5.88 0-10.66 4.78-10.66 10.66 0 1.88.49 3.71 1.43 5.32L5 27l5.88-1.74c1.56.85 3.31 1.29 5.14 1.29 5.88 0 10.66-4.78 10.66-10.66S21.9 5.33 16.02 5.33zm0 19.4c-1.7 0-3.33-.46-4.73-1.34l-.34-.21-3.49 1.03 1.03-3.4-.22-.35a8.68 8.68 0 0 1-1.34-4.62c0-4.8 3.91-8.71 8.71-8.71 4.8 0 8.71 3.91 8.71 8.71 0 4.8-3.91 8.71-8.71 8.71z"/>
        </svg>

        <span class="label">
          <span class="top">WhatsApp</span>
          <span class="main">HABLÁ CON UN OPERADOR Y RECLAMÁ EL BONO</span>
        </span>
      </button>
    </div>

    <footer>+18 · Jugá con responsabilidad</footer>
  </div>

  <script>
    const PHONE_E164 = "542234563494";
    const MESSAGE = "Hola 👋, vengo desde el anuncio. Quiero un usuario y reclamar el bono del 100%.";

    function waUrl(){
      return `https://wa.me/${PHONE_E164}?text=${encodeURIComponent(MESSAGE)}`;
    }

    function goWA(){
      // Contact SOLO en click (intención real)
      if(typeof window.fbq === "function"){
        fbq('track', 'Contact', { channel: 'whatsapp' });
      }
      setTimeout(() => {
        window.location.href = waUrl();
      }, 180);
    }

    const btn = document.getElementById("waBtn");
    if(btn){
      btn.addEventListener("click", goWA);
    }
  </script>
</body>
</html>

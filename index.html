<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BetCoin | Accediendo...</title>
  <meta name="description" content="Accediendo a BetCoin..." />

  <!-- Meta Pixel -->

    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

  <noscript>
    <img
      height="1"

      style="display:none"
      src="https://www.facebook.com/tr?id=1656348398725230&ev=PageView&noscript=1"
      alt=""

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #5c178f, #120018);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ffbf00;
    }

    h2 {
      margin: 10px 0 8px;
    }

    p {
      margin: 0 0 18px;
      opacity: 0.9;
    }

    .status {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 16px;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 20px;
      background: #ffbf00;
      color: black;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    .bar {
      margin-top: 18px;
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffbf00, #ffd76a);
      animation: loadBar 2s linear forwards;
    }

    @keyframes loadBar {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BET<span>COIN</span></div>

    <h2>Ingresando a la plataforma...</h2>
    <p>Te estamos redirigiendo automáticamente</p>

    <div class="bar"></div>
    <div class="status">Redirigiendo...</div>

    <a id="btn" class="btn" href="#">INGRESAR AHORA</a>
  </div>

  <script>
    const DESTINO = "https://betcointoken.com/auth/sign-up/autopubli";
    const params = window.location.search;
    const finalUrl = params ? DESTINO + params : DESTINO;

    const btn = document.getElementById("btn");
    btn.href = finalUrl;

    let redirected = false;

    function goToPlatform() {
      if (redirected) return;
      redirected = true;
      window.location.href = finalUrl;
    }

    function trackAndRedirect() {
      if (redirected) return;

      try {
        if (typeof fbq !== "undefined") {
          fbq("trackCustom", "BridgeRedirect", {
            destino: "plataforma",
            url_destino: finalUrl
          });
        }
      } catch (e) {
        console.log("No se pudo disparar BridgeRedirect", e);
      }

      setTimeout(goToPlatform, 500);
    }

    setTimeout(trackAndRedirect, 2000);

    btn.addEventListener("click", function(e) {
      e.preventDefault();
      trackAndRedirect();
    });
  </script>
</body>
</html>

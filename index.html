<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando con WhatsApp</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e);
      t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '857136047183641');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=857136047183641&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->

  <!-- Contact + Redirect a WhatsApp (CONFIG FINAL) -->
  <script>
    const phone = "5491125036531";
    const msg = "Hola 👋
Quiero acceder a la plataforma, Me creas un usuario?";
    const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);

    // 🔥 Disparo inmediato del evento Contact
    if (typeof fbq === "function") {
      fbq('track', 'Contact');
    }

    // ⏳ Delay largo para que Meta reciba el evento antes del redirect
    setTimeout(function () {
      window.location.href = url;
    }, 2000);
  </script>

  <style>
    body{
      margin:0;
      background:#e9f7ef;
      font-family: Arial, sans-serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:#1f7a4d;
    }
    .box{max-width:320px;padding:20px}
    .spinner{
      width:60px;height:60px;
      border:6px solid #c8ecd9;
      border-top:6px solid #25d366;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:0 auto 20px
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:14px;opacity:.8}
    a{display:block;margin-top:15px;color:#1f7a4d}
  </style>
</head>

<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Conectando con WhatsApp</h2>
    <p>Te redirigiremos en un momento</p>
    <a id="fallback" href="#">Si no se abre, tocá acá</a>
  </div>

  <script>
    // Link fallback por si el redirect automático falla
    document.getElementById("fallback").href = url;
  </script>
</body>
</html>

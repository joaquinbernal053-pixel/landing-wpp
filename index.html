  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #b8860b 0%, #040404 45%);
      color:#fff;

    .wrap{
      width:100%;

      padding:26px 18px 40px;
      text-align:center;
    }

    /* TEXTO TÍO RICO */
    .brand{
      font-size:42px;
      font-weight:900;
      letter-spacing:1px;
      margin:6px 0 12px;
      background: linear-gradient(180deg,#ffe9a3,#f6c453,#b8860b);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:
        0 2px 0 #8a6b14,
        0 4px 10px rgba(246,196,83,0.45);
    }
    .brand span{

      vertical-align:super;
    }

    .logo{
      display:flex;

    }
    .logo img{
      max-width:190px;
      opacity:0.65;
      filter: drop-shadow(0 0 12px rgba(246,196,83,0.35));
    }

    .vip{
      margin:10px 0 18px;
    }
    .vip span{
      display:inline-block;
      padding:8px 22px;
      border-radius:999px;
      background:linear-gradient(135deg,#f6c453,#b8860b);
      color:#111;
      font-weight:700;
      font-size:14px;
    }

    .card{
      background:linear-gradient(180deg,#0b1c2e,#040b14);
      border-radius:26px;
      padding:26px 20px;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
      text-align:center;
    }

    h1{
      font-size:26px;
      line-height:1.25;
      margin:0 0 10px;
    }
    h1 b{color:#f6c453}

    .sub{
      opacity:.75;
      font-size:14px;
      margin-bottom:18px;
    }

    .wpp{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:linear-gradient(135deg,#f6c453,#e0a800);
      color:#111;
      text-decoration:none;
      font-weight:800;
      border-radius:999px;
      padding:16px;
      font-size:18px;
      box-shadow:0 0 25px rgba(246,196,83,.6);
      animation:pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%{transform:scale(1);box-shadow:0 0 25px rgba(246,196,83,.5)}
      50%{transform:scale(1.06);box-shadow:0 0 45px rgba(246,196,83,.9)}
      100%{transform:scale(1);box-shadow:0 0 25px rgba(246,196,83,.5)}
    }

    .info{
      margin-top:16px;
      font-size:13px;
      opacity:.8;
    }

    .stats{
      display:flex;
      gap:10px;
      background:#0b1c2e;
      border-radius:18px;
      margin-top:18px;
      padding:14px 10px;
      font-size:13px;
    }
    .stats div{flex:1}
    .stats b{
      color:#f6c453;
      display:block;
      margin-top:4px;
      font-size:15px;
    }

    .footer{
      margin-top:24px;
      opacity:.55;
      font-size:12px;

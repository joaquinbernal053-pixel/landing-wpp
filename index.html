<!doctype html>
<html lang="es">
<head>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #b8860b 0%, #040404 45%);
      color:#fff;
      display:flex;
      justify-content:center;
    }
    .wrap{
      width:100%;
      max-width:420px;
      padding:26px 18px 40px;
    }
    .logo{
      display:flex;
      justify-content:center;
      margin-bottom:10px;
    }
    .logo img{
      max-width:210px;
      height:auto;
    }
    .vip{
      text-align:center;
      margin-bottom:18px;
    }
    .vip span{
      display:inline-block;
      padding:8px 22px;
      border-radius:999px;
      background:linear-gradient(135deg,#f6c453,#b8860b);
      color:#111;
      font-weight:700;
      font-size:14px;
    }
    .card{
      background:linear-gradient(180deg,#0b1c2e,#040b14);
      border-radius:26px;
      padding:26px 20px;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
      text-align:center;
    }
    h1{
      font-size:26px;
      line-height:1.25;
      margin:0 0 10px;
    }
    h1 b{color:#f6c453}
    .sub{
      opacity:.75;
      font-size:14px;
      margin-bottom:18px;
    }

    /* BOTÓN WHATSAPP */
    .wpp{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:linear-gradient(135deg,#f6c453,#e0a800);
      color:#111;
      text-decoration:none;
      font-weight:800;
      border-radius:999px;
      padding:16px;
      font-size:18px;
      box-shadow:0 0 25px rgba(246,196,83,.6);
      animation: pulse 2s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    .wpp:active{
      transform: scale(0.98);
    }

    /* EFECTO BOMBEO */
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(246,196,83,.5);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 45px rgba(246,196,83,.9);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(246,196,83,.5);
      }
    }

    .info{
      margin-top:16px;
      font-size:13px;
      opacity:.8;
    }
    .stats{
      display:flex;
      justify-content:space-between;
      gap:10px;
      background:#0b1c2e;
      border-radius:18px;
      margin-top:18px;
      padding:14px 10px;
      text-align:center;
      font-size:13px;
    }
    .stats > div{
      flex:1;
    }
    .stats b{
      color:#f6c453;
      display:block;
      margin-top:4px;
      font-size:15px;
    }
    .footer{
      margin-top:24px;
      text-align:center;
      opacity:.55;
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="vip">
      <span>ACCESO VIP</span>
    </div>

    <div class="card">
      <h1>OBTENÉ UN <b>50%</b> EN TU<br>PRIMER DEPÓSITO</h1>
      <div class="sub">Escribinos apretando el botón de abajo</div>

      <!-- SOLO EVENTOS: WhatsAppClick (custom) + Subscribe -->
      <a class="wpp"
         href="https://wa.me/TU_NUMERO_WPP?text=Quiero%20acceso%20VIP"
         target="_blank"
         onclick="fbq('trackCustom','WhatsAppClick'); fbq('track','Subscribe');">
        💬 WhatsApp Oficial
      </a>

      <div class="info">
        Atención y retiros sin límites las 24 hs
      </div>

      <div class="stats">
        <div>
          Mínimo carga
          <b>$2.000</b>
        </div>
        <div>
          Mínimo retiro
          <b>$5.000</b>
        </div>
        <div>
          Retiros
          <b>24 hs</b>
        </div>

    </div>

    <div class="footer">

    </div>

</html>
